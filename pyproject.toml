[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "local-llm-benchmarks"
version = "0.1.0"
description = "Reproducible benchmarks for locally served large language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "local-llm-benchmarks contributors" }]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "plotly>=5.20",
  "psutil>=5.9",
  "pyarrow>=16,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "nbclient>=0.10", "nbformat>=5.10", "pandas>=2.2"]
analysis = ["duckdb>=1.1,<2", "polars>=1.0", "jupyterlab>=4.2", "ipykernel>=6.29"]

[project.scripts]
llm-bench = "llm_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/llm_bench/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["llm_bench"]

[[tool.mypy.overrides]]
module = ["plotly.*", "psutil", "pyarrow.*"]
ignore_missing_imports = true
