version = 1
requires-python = ">=3.10"
resolution-markers = [
    "python_full_version >= '3.10'",
]

[[package]]
name = "local-llm-benchmarks"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "plotly" },
    { name = "psutil" },
    { name = "pydantic" },
    { name = "rich" },
    { name = "typer" },
]

[package.metadata]
requires-dist = [
    { name = "plotly", specifier = ">=5.20" },
    { name = "psutil", specifier = ">=5.9" },
    { name = "pydantic", specifier = ">=2.7" },
    { name = "rich", specifier = ">=13.7" },
    { name = "typer", specifier = ">=0.12" },
]
